<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <policy user="root">
        <allow own="de.poetaster.tailwind"/>
        <allow send_destination="de.poetaster.tailwind"/>
        <allow receive_sender="de.poetaster.tailwind"/>
    </policy>

    <policy context="default">
        <allow send_destination="de.poetaster.tailwind"/>
        <allow receive_sender="de.poetaster.tailwind"/>
    </policy>

</busconfig>
